<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soproni Egyetem - Faanyag Tudástár és Kalkulátor</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --accent-color: #2e7d32;
            --accent-hover: #388e3c;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --input-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 60px;
        }

        header {
            background-color: var(--container-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
        }

        header h1 {
            font-size: 20px;
            color: var(--text-color);
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: var(--container-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-muted);
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(46, 125, 50, 0.1);
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-value {
            font-weight: bold;
            color: var(--text-color);
        }

        /* Navigációs sáv */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--container-bg);
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 0;
            flex: 1;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-btn.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        .nav-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Fafajok lista */
        .search-bar {
            margin-bottom: 15px;
        }

        .fafaj-lista {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fafaj-item {
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .fafaj-item:hover {
            border-color: var(--accent-color);
        }

        .fafaj-item h3 {
            font-size: 16px;
            color: var(--text-color);
        }

        /* Adatlap stílusok */
        .back-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .back-btn:hover {
            background-color: var(--accent-hover);
        }

        .adatlap-spec {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .adatlap-blokk {
            background-color: var(--input-bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .adatlap-blokk strong {
            color: var(--accent-color);
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .adatlap-al-lista {
            list-style-type: none;
            padding-left: 5px;
            margin-top: 5px;
        }

        .adatlap-al-lista li {
            margin-bottom: 4px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Soproni Egyetem</h1>
        <div class="subtitle">SOE FMK - Faanyag Tudástár és Kalkulátor</div>
    </header>

    <div id="kalkulator-container" class="container">
        <div class="input-group">
            <label for="fafaj-select">Fafaj választása</label>
            <select id="fafaj-select" onchange="frissitMindenSzamitast()">
                </select>
        </div>

        <div class="input-group">
            <label for="kiindulo-nedv">Kiinduló nedvességtartalom ($W_1$, %)</label>
            <input type="number" id="kiindulo-nedv" value="30" min="0" max="100" oninput="frissitMindenSzamitast()">
        </div>

        <div class="input-group">
            <label for="cel-nedv">Cél nedvességtartalom ($W_2$, %)</label>
            <input type="number" id="cel-nedv" value="12" min="0" max="30" oninput="frissitMindenSzamitast()">
        </div>

        <div class="result-box">
            <div class="result-row">
                <span>Rostirányú zsugorodás ($\Delta L_r$):</span>
                <span class="result-value" id="res-rost">0.00 %</span>
            </div>
            <div class="result-row">
                <span>Sugárirányú zsugorodás ($\Delta L_s$):</span>
                <span class="result-value" id="res-sugar">0.00 %</span>
            </div>
            <div class="result-row">
                <span>Húrirányú zsugorodás ($\Delta L_h$):</span>
                <span class="result-value" id="res-hur">0.00 %</span>
            </div>
            <div class="result-row">
                <span>Térfogati zsugorodás ($\Delta V$):</span>
                <span class="result-value" id="res-terf">0.00 %</span>
            </div>
        </div>
    </div>

    <div id="fafaj-lista-container" class="container hidden">
        <div class="search-bar">
            <input type="text" id="fafaj-kereso" placeholder="Fafaj keresése..." oninput="szurFafajok()">
        </div>
        <div id="fafaj-lista" class="fafaj-lista">
            <p style="color:var(--text-muted);">Adatbázis betöltése...</p>
        </div>
    </div>

    <div id="fafaj-adatlap-nezetház" class="container hidden">
        <button class="back-btn" onclick="visszaAListahoz()">← Vissza a listához</button>
        <div id="adatlap-tartalom"></div>
    </div>

    <div id="terkep-container" class="container hidden">
        <iframe src="https://www.google.com/maps/d/embed?mid=1vX69N7w_ZkKclp-5wSWhEunO9_8_0jM&ehbc=2E312F"></iframe>
    </div>

    <nav>
        <button class="nav-btn active" id="btn-kalkulator" onclick="showPage('kalkulator-container')">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm0 8H7v-2h10v2z"/></svg>
            Kalkulátor
        </button>
        <button class="nav-btn" id="btn-fafajok" onclick="showPage('fafajok')">
            <svg viewBox="0 0 24 24"><path d="M2 22h20V2zM5.17 18H18v-3.83l-3.83-3.83H11.5L8.33 14H5.17V18z"/></svg>
            Tudástár
        </button>
        <button class="nav-btn" id="btn-terkep" onclick="showPage('terkep-container')">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Térkép
        </button>
    </nav>

    <script>
        // GLOBÁLIS ADATBÁZIS (A Google Táblázatból fog megtelni)
        let fafajokAdatbazis = [];
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTvY16H4UXrflyWfqzu6yn_LHvlzvcRKSpSYsl0gvd20SKPO_25ruzj6xum04xLDGlvj7EchBs0LFEk/pub?gid=2078134923&single=true&output=csv";

        // CSV FÁJL ÉRTELMEZŐ (Kezeli az idézőjeleket és az új sorokat a cellákon belül)
        function parseCSV(text) {
            let lines = [];
            let row = [""];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            return lines;
        }

        // TÁBLÁZAT ONLINE BETÖLTÉSE
        async function betoltAdatbazis() {
            try {
                const response = await fetch(GOOGLE_SHEETS_CSV_URL);
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                if (rows.length < 2) return;
                
                const headers = rows[0].map(h => h.trim());
                fafajokAdatbazis = [];

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length < headers.length || !row[0]) continue;

                    let fa = {};
                    headers.forEach((header, index) => {
                        fa[header] = row[index] ? row[index].trim() : "";
                    });

                    fa.id = i - 1; 
                    fafajokAdatbazis.push(fa);
                }

                // Kalkulátor legördülő menüjének feltöltése
                frissitFafajSelect();
                
                // Tudástár lista frissítése
                megjelenitFafajok(fafajokAdatbazis);
                
                // Első számítás futtatása
                frissitMindenSzamitast();
            } catch (error) {
                console.error("Nem sikerült beolvasni a Google Táblázatot:", error);
                document.getElementById('fafaj-lista').innerHTML = "<p style='color:red;'>Hiba történt az online adatbázis betöltésekor.</p>";
            }
        }

        // Legördülő választó kitöltése a táblázat alapján
        function frissitFafajSelect() {
            const select = document.getElementById('fafaj-select');
            select.innerHTML = "";
            fafajokAdatbazis.forEach(fa => {
                select.innerHTML += `<option value="${fa.id}">${fa.Fa_neve}</option>`;
            });
        }

        // KALKULÁTOR SZÁMÍTÁSI LOGIKA
        function frissitMindenSzamitast() {
            if (fafajokAdatbazis.length === 0) return;

            const select = document.getElementById('fafaj-select');
            const faId = parseInt(select.value);
            const fa = fafajokAdatbazis.find(f => f.id === faId);

            if (!fa) return;

            let w1 = parseFloat(document.getElementById('kiindulo-nedv').value) || 0;
            let w2 = parseFloat(document.getElementById('cel-nedv').value) || 0;

            // Szabályozás a rosttelítettségi pont (30%) feletti értékekre
            if (w1 > 30) w1 = 30;
            if (w2 > 30) w2 = 30;
            if (w1 < 0) w1 = 0;
            if (w2 < 0) w2 = 0;

            // Zsugorodási értékek kinyerése a "Zsugorodás" cellából vagy alapértelmezett érték
            // (Mivel a te táblázatodban szövegesen van egy cellában, itt most mintának fix vagy biztonsági értékkel számolunk, amíg külön cellába nem tesszük a tiszta matek számokat)
            let zsugRostMax = 0.1;
            let zsugSugarMax = 4.0;
            let zsugHurMax = 8.0;
            let zsugTerfMax = 12.0;

            // Ha a szöveges cellából megpróbáljuk kiszedni a számot (pl. "Rostirányú: 0.1%")
            if(fa.Zsugorodás) {
                const kinyerSzam = (szoveg, kulcsszo) => {
                    const reg = new RegExp(kulcsszo + '[^0-9]*([0-9.]+)');
                    const talalat = szoveg.match(reg);
                    return talalat ? parseFloat(talalat[1]) : null;
                };
                zsugRostMax = kinyerSzam(fa.Zsugorodás, "Rost") || zsugRostMax;
                zsugSugarMax = kinyerSzam(fa.Zsugorodás, "Sug") || zsugSugarMax;
                zsugHurMax = kinyerSzam(fa.Zsugorodás, "Húr") || zsugHurMax;
                zsugTerfMax = kinyerSzam(fa.Zsugorodás, "Térf") || zsugTerfMax;
            }

            const tenyezo = (w1 - w2) / 30;

            document.getElementById('res-rost').innerText = (zsugRostMax * tenyezo).toFixed(2) + " %";
            document.getElementById('res-sugar').innerText = (zsugSugarMax * tenyezo).toFixed(2) + " %";
            document.getElementById('res-hur').innerText = (zsugHurMax * tenyezo).toFixed(2) + " %";
            document.getElementById('res-terf').innerText = (zsugTerfMax * tenyezo).toFixed(2) + " %";
        }

        // TUDÁSTÁR: LISTA MEGJELENÍTÉSE
        function megjelenitFafajok(lista) {
            const listaDiv = document.getElementById('fafaj-lista');
            listaDiv.innerHTML = "";
            
            if(lista.length === 0) {
                listaDiv.innerHTML = "<p style='color:var(--text-muted);'>Nincs a keresésnek megfelelő fafaj.</p>";
                return;
            }

            lista.forEach(fa => {
                listaDiv.innerHTML += `
                    <div class="fafaj-item" onclick="megnyitAdatlap(${fa.id})">
                        <h3>${fa.Fa_neve || 'Névtelen fafaj'}</h3>
                    </div>
                `;
            });
        }

        // TUDÁSTÁR: KERESŐ FUNKCIÓ
        function szurFafajok() {
            let keresoSzo = document.getElementById('fafaj-kereso').value.toLowerCase();
            let szurtLista = fafajokAdatbazis.filter(fa => 
                (fa.Fa_neve && fa.Fa_neve.toLowerCase().includes(keresoSzo))
            );
            megjelenitFafajok(szurtLista);
        }

        // TUDÁSTÁR: EGYEDI ADATLAP MEGNYITÁSA
        function megnyitAdatlap(id) {
            const fa = fafajokAdatbazis.find(f => f.id === id);
            
            if(!fa) { 
                alert("A keresett fafaj nem található."); 
                return; 
            }

            document.getElementById('fafaj-lista-container').style.display = 'none';
            document.getElementById('fafaj-adatlap-nezetház').style.display = 'block';

            const formazSzoveg = (szoveg) => szoveg ? szoveg.replace(/\n/g, '<br>') : "Adat nem elérhető";

            const tartalom = document.getElementById('adatlap-tartalom');
            tartalom.innerHTML = `
                <h2 style="margin-top:15px; color: var(--accent-color);">${fa.Fa_neve || 'Ismeretlen fafaj'}</h2>
                <div class="adatlap-spec">
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Leírás:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Leírás)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Érdekesség:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Érdekesség)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Élőfa jellemzői:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa['Élőfa jellemzői'])}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Makroszkópikus szerkezet:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Makroszkópikus)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Mikroszkópikus szerkezet:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Mikroszkópikus)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Fahibák, károsodások, tartósság:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Fahibák_fakárosodások_tartósság)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Fizikai tulajdonságok:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Fizikai)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Sűrűség:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Sűrűség)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Zsugorodás:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Zsugorodás)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Mechanikai tulajdonságok:</strong> <p style="margin:2px 0 0 0; color:#ccc; line-height: 1.6;">${formazSzoveg(fa.Mechanikai)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Kémiai tulajdonságok:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa['Kémiai tulajdonságok'])}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Megmunkálási sajátosságok:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Megmunkálási sajátosságok)}</p></div>
                    <div class="adatlap-blokk" style="color:#ccc;"><strong>Felhasználás:</strong> <p style="margin:2px 0 0 0; color:#ccc;">${formazSzoveg(fa.Fölhasználás)}</p></div>
                </div>
            `;
        }

        function visszaAListahoz() {
            document.getElementById('fafaj-adatlap-nezetház').style.display = 'none';
            document.getElementById('fafaj-lista-container').style.display = 'block';
        }

        // NAVIGÁCIÓS RENDSZER (Oldalak váltása)
        function showPage(pageId) {
            // Összes főoldal elrejtése
            const pages = ['kalkulator-container', 'fafaj-lista-container', 'fafaj-adatlap-nezetház', 'terkep-container'];
            pages.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });

            // Gombok aktív állapotának törlése
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Konkrét oldal megjelenítése + gomb színezése
            if (pageId === 'fafajok') {
                document.getElementById('fafaj-lista-container').style.display = 'block';
                document.getElementById('btn-fafajok').classList.add('active');
            } else {
                document.getElementById(pageId).style.display = 'block';
                if (pageId === 'kalkulator-container') document.getElementById('btn-kalkulator').classList.add('active');
                if (pageId === 'terkep-container') document.getElementById('btn-terkep').classList.add('active');
            }
        }

        // INDULÁSKOR LEFUTÓ FÜGGVÉNY
        window.onload = function() {
            betoltAdatbazis();
        };
    </script>
</body>
</html>
