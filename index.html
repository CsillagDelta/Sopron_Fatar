<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soproni Fa- és Tudástár</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #4caf50;
            --accent-hover: #45a049;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        h2 { color: var(--accent-color); border-bottom: 2px solid var(--card-bg); padding-bottom: 5px; }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            flex: 1;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: #555; }
        .btn-secondary:hover { background-color: #666; }

        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        .menu-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #3d3d3d;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.2);
        }
        .menu-card h2 { border: none; margin-top: 0; }

        .page { display: none; }
        .active-page { display: block; }

        .map-container {
            position: relative;
            padding-bottom: 75%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .map-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .tudastar-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        @media(min-width: 600px) {
            .tudastar-layout { flex-direction: row; }
            .tudastar-nav { width: 30%; }
            .tudastar-content { width: 70%; }
        }

        .sub-menu-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #3d3d3d;
            padding: 10px 15px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
        }
        .sub-menu-btn:hover, .sub-menu-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .calc-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

            padding: 10
